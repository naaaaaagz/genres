<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2f3033">
<title>Genre Map</title>
<style>
:root{
  --bg:#2f3033;
  --bg-0:rgba(47,48,51,0);
  --ink:#ececee;
  --ink-dim:#9a9b9f;
  --ink-faint:#6c6d72;
  --brick-line:rgba(255,255,255,.60);
  --brick-fill:#292a2d;
  --band:rgba(255,255,255,.18);
  --edge:#ffffff;
  --accent:#8fb6ff;
  --premium:#f2c94c;
  --hdr-h:114px;
  --ftr-h:21px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:pan-y}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* ---------- header ---------- */
#topbar{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--bg);
  box-shadow:0 10px 18px -12px rgba(0,0,0,.8)}
#brand{background:#000;color:#fff;font-size:12px;letter-spacing:.34em;text-align:center;
  font-weight:600;padding:calc(env(safe-area-inset-top,0px) + 9px) 0 9px}
#areabar{display:flex;align-items:center;justify-content:space-between;padding:0 10px;
  max-width:720px;margin:0 auto;
  touch-action:none;user-select:none;-webkit-user-select:none}
.chev{width:44px;height:34px;touch-action:none;font-size:24px;line-height:1;color:var(--ink-dim);
  display:flex;align-items:center;justify-content:center;border-radius:8px;transition:color .15s,transform .15s}
.chev:active{color:#fff;transform:scale(.88)}
#areaName{flex:1;text-align:center;font-size:15px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  cursor:grab}

/* ---------- drilldown ---------- */
#drill{display:flex;align-items:flex-end;gap:10px;padding:8px 16px 10px;
  max-width:720px;margin:0 auto}
.dlabel{font-size:11px;letter-spacing:.06em;color:var(--ink);font-weight:600;padding-bottom:1px;flex:none}
#dlevels{flex:1;display:flex;align-items:flex-end;justify-content:space-between;position:relative}
.dstep{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:0 2px;flex:none;z-index:1}
.dstep .dnum{font-size:12px;font-weight:700;color:var(--ink);line-height:1;transition:color .15s,opacity .15s;opacity:.55}
.dstep.premium .dnum{color:var(--premium)}
.dstep.on .dnum{opacity:1}
.dstep .dblip{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);
  background:var(--bg);transition:background .15s,transform .15s,border-color .15s}
.dstep.premium .dblip{border-color:var(--premium)}
.dstep.on .dblip{background:var(--ink);transform:scale(1.15)}
.dstep.premium.on .dblip{background:var(--premium)}
.dstep .dlock{position:absolute;top:-9px;right:-3px;width:8px;height:9px;opacity:.9}
#dlevels .drail{position:absolute;left:8px;right:8px;bottom:4px;height:0;
  border-top:1px dashed rgba(255,255,255,.34);z-index:0}
.dhit{position:absolute;inset:-12px -10px -14px;}

/* ---------- carousel of area panes ---------- */
#viewport{position:absolute;top:var(--hdr-h);left:0;right:0;
  bottom:calc(var(--ftr-h) + env(safe-area-inset-bottom,0px));overflow:hidden;touch-action:pan-y}
#track{position:absolute;top:0;left:0;height:100%;width:300%;display:flex;
  touch-action:pan-y;will-change:transform}
#track.anim{transition:transform .3s cubic-bezier(.25,.8,.3,1)}
.pane{width:33.33333%;height:100%;flex:none;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;
  background:var(--bg)}
.stage{position:relative;touch-action:pan-y;transform-origin:50% 0;margin:0 auto}
.edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none}
.edges .e{stroke:var(--edge)}

.band{position:absolute;left:0;right:0;pointer-events:none;transition:opacity .22s}
.band .bline{position:absolute;left:8px;right:8px;top:0;height:0;
  border-top:2px dashed var(--band)}
.band .blabel{position:absolute;right:9px;top:5px;font-size:calc(15px*var(--fs,1));font-weight:800;
  color:var(--band);letter-spacing:.03em;max-width:calc(46px*var(--fs,1));text-align:right;
  line-height:1.02;word-break:normal;overflow-wrap:anywhere}
.band .blabel.sm{font-size:11px;letter-spacing:.01em;line-height:1.08}

.brick{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;
  border:1.5px solid var(--brick-line);background:var(--brick-fill);color:var(--ink);
  font-size:calc(11.6px*var(--fs,1));line-height:1.2;font-weight:600;letter-spacing:.005em;
  padding:2px 5px;border-radius:2.5px;overflow:hidden;
  transition:opacity .22s,border-color .22s,box-shadow .22s,color .22s}
/* size tracks Importance: 5 reads as a landmark, 1 stays legible */
.brick.i5{font-size:calc(14.5px*var(--fs,1));border-width:2px;border-radius:3.5px;letter-spacing:-.005em}
.brick.i4{font-size:calc(12.8px*var(--fs,1));border-width:1.75px;border-radius:3px}
.brick.i3{font-size:calc(11.6px*var(--fs,1))}
.brick.i2{font-size:calc(10.4px*var(--fs,1));border-width:1.25px}
.brick.i1{font-size:calc(9.6px*var(--fs,1));border-width:1px;
  border-color:color-mix(in srgb,var(--brick-line) 78%,transparent)}
.brick.ext{border-radius:999px;border-style:dashed;border-width:1.25px;
  border-color:var(--x-line);background:var(--x-fill);color:var(--x-ink);
  font-weight:500;font-size:calc(10.5px*var(--fs,1));line-height:1.1}
.brick.ext .xarea{display:block;font-size:calc(8px*var(--fs,1));letter-spacing:.1em;text-transform:uppercase;
  opacity:.62;margin-top:2px}

/* omitted genres: faint blocks sitting on the connector, and fading stubs
   where a filtered-out branch leaves a genre */
.edges .dud{fill:color-mix(in srgb,var(--edge) 13%,transparent);
  stroke:color-mix(in srgb,var(--edge) 20%,transparent);stroke-width:.75;
  pointer-events:none;transition:opacity .22s}
.edges .stub{stroke:var(--edge);pointer-events:none;transition:opacity .22s}
.pane.focus .edges .dud,.pane.focus .edges .stub{opacity:.04}

/* re-arrange animation: bricks glide from their old place to the new one */
.brick.morphing,.band.morphing{
  transition:transform 320ms cubic-bezier(.22,.9,.28,1),opacity 260ms ease-out;
  will-change:transform}

/* secondary-area bubbles */
.edges .blob{pointer-events:none;transition:opacity .22s}
.edges .bloblab{font-size:calc(10.5px*var(--fs,1));font-style:italic;font-weight:600;letter-spacing:.04em;
  text-anchor:middle;pointer-events:none;transition:opacity .22s}
.pane.focus .edges .blob,.pane.focus .edges .bloblab{opacity:.25}

/* focus mode: the tapped genre's whole lineage stays lit */
.pane.focus .brick{opacity:.14}
.pane.focus .brick.rel{opacity:1}
.pane.focus .brick.sel{opacity:1;border-color:var(--accent);color:#fff;
  box-shadow:0 0 0 1px var(--accent),0 0 18px -2px var(--accent)}
.pane.focus .band{opacity:.4}
.pane.focus .edges .e{opacity:.05}
.pane.focus .edges .e.rel{opacity:1;stroke:var(--accent)}
.edges .e{transition:opacity .22s,stroke .22s}

/* ---------- time-direction toggle ---------- */
#flipBtn{position:absolute;top:9px;left:calc(var(--stage-left,0px) + 9px);z-index:30;width:30px;height:38px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  border:1px solid color-mix(in srgb,var(--brick-line) 42%,transparent);
  background:var(--bg);border-radius:7px;color:var(--ink-dim);
  box-shadow:0 3px 14px -2px rgba(0,0,0,.65);
  transition:color .15s,transform .12s,border-color .15s,background-color .3s ease}
#flipBtn:active{transform:scale(.9);color:var(--ink)}
#blobBtn{position:absolute;top:53px;left:calc(var(--stage-left,0px) + 9px);z-index:30;width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid color-mix(in srgb,var(--brick-line) 42%,transparent);
  background:var(--bg);border-radius:7px;color:var(--ink-faint);
  box-shadow:0 3px 14px -2px rgba(0,0,0,.65);
  transition:color .15s,transform .12s,border-color .15s}
#blobBtn:active{transform:scale(.9)}
#blobBtn.on{color:var(--accent);border-color:var(--accent);
  box-shadow:0 3px 14px -2px rgba(0,0,0,.65),0 0 12px -4px var(--accent)}
#blobBtn.dim{opacity:.34}
#flipBtn .fArrow{transition:transform .25s cubic-bezier(.3,.8,.3,1)}
#flipBtn.down .fArrow{transform:rotate(180deg)}
#flipBtn svg{display:block}

/* ---------- footer ---------- */
#footer{position:fixed;left:0;right:0;bottom:0;z-index:50;height:var(--ftr-h);
  display:flex;align-items:center;justify-content:center;background:#000;
  font-size:9.5px;letter-spacing:.09em;color:#7e8086;
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:content-box}
#footer a{color:#cfd6e4;text-decoration:none;font-weight:600;margin-left:.35em}
#footer a:hover,#footer a:focus-visible{color:#fff}

/* ---------- fades ---------- */
.fade{position:absolute;left:0;right:0;height:64px;pointer-events:none;z-index:20;transition:opacity .25s}
#fadeTop{top:var(--hdr-h);background:linear-gradient(to bottom,var(--bg) 6%,var(--bg-0) 100%);opacity:0}
#fadeBottom{bottom:calc(var(--ftr-h) + env(safe-area-inset-bottom,0px));height:88px;background:linear-gradient(to top,var(--bg) 10%,var(--bg-0) 100%)}

/* ---------- swipe hint (plays once on load) ---------- */
#swipeHint{position:absolute;inset:0;z-index:26;pointer-events:none;opacity:0;
  display:flex;align-items:center;justify-content:space-between;padding:0 4px}
#swipeHint span{font-size:50px;line-height:1;font-weight:200;color:var(--ink-dim);
  text-shadow:0 2px 16px rgba(0,0,0,.85)}
#swipeHint.play{animation:swipePulse 2.5s ease-in-out forwards}
#swipeHint.play .sL{animation:nudgeL 2.5s ease-in-out}
#swipeHint.play .sR{animation:nudgeR 2.5s ease-in-out}
@keyframes swipePulse{
  0%{opacity:0}   8%{opacity:.9}  24%{opacity:0}
  38%{opacity:.9} 54%{opacity:0}
  68%{opacity:.9} 84%{opacity:0}  100%{opacity:0}}
@keyframes nudgeL{
  0%,24%,54%,84%,100%{transform:translateX(0)}
  8%,38%,68%{transform:translateX(7px)}}
@keyframes nudgeR{
  0%,24%,54%,84%,100%{transform:translateX(0)}
  8%,38%,68%{transform:translateX(-7px)}}

/* ---------- scroll hint ---------- */
#scrollHint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + var(--ftr-h) + 18px);
  z-index:25;display:flex;flex-direction:column;align-items:center;gap:6px;
  pointer-events:none;opacity:0;transition:opacity .5s}
#scrollHint.show{opacity:1;animation:bob 1.5s ease-in-out infinite}
#scrollHint .htext{font-size:11px;letter-spacing:.09em;color:var(--ink-dim);text-transform:lowercase;
  background:var(--bg);padding:4px 12px;border-radius:999px}
#scrollHint svg{display:block}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}

/* ---------- tooltip ---------- */
#tip{position:absolute;z-index:45;padding:6px 11px;border-radius:14px;font-size:11px;font-weight:600;
  letter-spacing:.02em;background:#f0f0f2;color:#1d1e20;white-space:nowrap;
  transform:translate(-50%,-100%) scale(.9);opacity:0;pointer-events:none;
  transition:opacity .16s,transform .16s;box-shadow:0 6px 20px -6px rgba(0,0,0,.7)}
#tip.show{opacity:1;transform:translate(-50%,-100%) scale(1);pointer-events:auto}
#tip.premium{background:var(--premium);color:#22200f}
#tip::after{content:"";position:absolute;left:50%;bottom:-4px;margin-left:-4px;
  border:4px solid transparent;border-top-color:#f0f0f2;border-bottom:0}
#tip.premium::after{border-top-color:var(--premium)}

/* ---------- info sheet ---------- */
#scrim{position:fixed;inset:0;z-index:60;background:rgba(20,21,23,.62);backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .22s}
#scrim.show{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%) scale(.96);
  width:min(330px,calc(100vw - 40px));background:rgba(44,45,49,.95);
  border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:20px 20px 18px;
  opacity:0;transition:opacity .22s,transform .22s;
  box-shadow:0 26px 60px -20px rgba(0,0,0,.85)}
#scrim.show #sheet{opacity:1;transform:translate(-50%,-50%) scale(1)}
#sheet h2{margin:0 0 10px;font-size:19px;font-weight:700;letter-spacing:.01em;line-height:1.2}
#sheet .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
#sheet .chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim);
  border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:4px 9px}
#sheet .chip img{width:17px;height:12px;object-fit:cover;border-radius:1px;display:block}
#sheet p{margin:0;font-size:13px;line-height:1.55;color:#c3c4c8;font-weight:400}
#sheetClose{position:absolute;top:8px;right:8px;width:36px;height:36px;display:flex;
  align-items:center;justify-content:center;font-size:20px;color:var(--ink-dim);border-radius:50%}
#sheetClose:active{color:#fff}

/* ---------- loading ---------- */
#loading{position:fixed;inset:0;z-index:90;background:#2f3033;display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:14px;
  transition:opacity .4s}
#loading.done{opacity:0;pointer-events:none}
#loading .ring{width:26px;height:26px;border:2px solid rgba(255,255,255,.18);
  border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite}
#loading .msg{font-size:11px;letter-spacing:.24em;color:var(--ink-faint);text-transform:uppercase}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header id="topbar">
  <div id="brand">GENRE MAP</div>
  <div id="areabar">
    <button class="chev" id="prevArea" aria-label="Previous area">&#8249;</button>
    <div id="areaName">&nbsp;</div>
    <button class="chev" id="nextArea" aria-label="Next area">&#8250;</button>
  </div>
  <div id="drill">
    <span class="dlabel">drilldown</span>
    <div id="dlevels"><div class="drail"></div></div>
  </div>
</header>

<div id="viewport">
  <button id="flipBtn" aria-label="Show oldest first">
    <svg class="fArrow" width="13" height="13" viewBox="0 0 13 13" fill="none">
      <path d="M6.5 11.5V1.5M6.5 1.5L2.2 5.8M6.5 1.5l4.3 4.3" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
      <circle cx="6" cy="6" r="4.7" stroke="currentColor" stroke-width="1.3"/>
      <path d="M6 3.3V6l1.9 1.2" stroke="currentColor" stroke-width="1.3"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <button id="blobBtn" aria-label="Show secondary areas">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
      <circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2"/>
      <circle cx="8" cy="8" r="2.7" stroke="currentColor" stroke-width="1.2"/>
    </svg>
  </button>
  <div id="track">
    <section class="pane"><div class="stage"><svg class="edges" xmlns="http://www.w3.org/2000/svg"></svg></div></section>
    <section class="pane"><div class="stage"><svg class="edges" xmlns="http://www.w3.org/2000/svg"></svg></div></section>
    <section class="pane"><div class="stage"><svg class="edges" xmlns="http://www.w3.org/2000/svg"></svg></div></section>
  </div>
</div>

<div id="swipeHint"><span class="sL">&#8249;</span><span class="sR">&#8250;</span></div>

<div class="fade" id="fadeTop"></div>
<div class="fade" id="fadeBottom"></div>

<div id="scrollHint">
  <span class="htext" id="hintText">scroll down for the past</span>
  <svg width="30" height="15" viewBox="0 0 30 15" fill="none">
    <path d="M2 2 L15 13 L28 2" stroke="#9a9b9f" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div>

<div id="tip"></div>

<div id="scrim">
  <div id="sheet">
    <button id="sheetClose" aria-label="Close">&times;</button>
    <h2 id="sheetName"></h2>
    <div class="meta" id="sheetMeta"></div>
    <p id="sheetDesc"></p>
  </div>
</div>

<footer id="footer">powered by<a href="https://nagz.space" target="_blank" rel="noopener noreferrer">nagz.space</a></footer>

<div id="loading"><div class="ring"></div><div class="msg">mapping genres</div></div>
