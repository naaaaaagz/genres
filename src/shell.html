<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171a20;color:#eef1f5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}#viewport{position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:radial-gradient(circle at center,#20242b 0,#171a20 72%);user-select:none}#viewport.panning{cursor:grabbing}#timeline{position:absolute;left:0;top:0;transform-origin:0 0;isolation:isolate}#timeline.interacting{will-change:transform}.rings,.areas,.edges{position:absolute;inset:0;overflow:visible;pointer-events:none}.rings{z-index:0}.ring{fill:none;stroke:#737b88;stroke-width:1.15;stroke-dasharray:8 10;opacity:.52}.area-lobe,.secondary-lobe{stroke-linecap:round;stroke-linejoin:round}.area-lobe{opacity:.14}.secondary-lobe{opacity:.22}.decade{position:absolute;padding:4px 8px;border-radius:12px;background:#20242cf0;color:#d8dde5;font-size:14px;font-weight:750;letter-spacing:.045em;white-space:nowrap;z-index:3;transform:translate(-50%,-50%)}
.area-label,.secondary-label{position:absolute;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;border:1px solid;border-radius:9px}
.area-label{z-index:1.5;font-weight:800;letter-spacing:.03em;padding:4px 12px}
.secondary-label{z-index:1.4;font-weight:650;letter-spacing:.02em;padding:2px 8px;font-size:12.5px}.node{position:absolute;display:flex;align-items:center;gap:8px;border:1px solid;border-radius:7px;color:#f7f9fc;box-shadow:0 2px 6px rgba(0,0,0,.42);line-height:1.12;white-space:nowrap;z-index:2;transition:opacity .12s,filter .12s,box-shadow .12s}.name{font-weight:680}.flags{display:flex;align-items:center;gap:4px;margin-left:auto;padding-left:2px}.flag{display:block;width:20px;height:15px;object-fit:cover;border-radius:1px;box-shadow:0 0 0 1px rgba(255,255,255,.18);pointer-events:none;-webkit-user-drag:none}.flag.symbol{object-fit:contain;box-shadow:none;filter:invert(1);opacity:.9}.areas{z-index:.5}.edges{z-index:1}.edge{fill:none;stroke:#a0a9b7;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round;opacity:.62;transition:opacity .12s,stroke-width .12s}#timeline.chain-hover .node{opacity:.18;filter:saturate(.45)}#timeline.chain-hover .edge{opacity:.07}#timeline.chain-hover .node.chain-highlight{opacity:1;filter:none;z-index:4;box-shadow:0 0 0 2px rgba(255,255,255,.72),0 3px 10px rgba(0,0,0,.6)}#timeline.chain-hover .edge.chain-highlight{opacity:1;stroke:#f3f6fa;stroke-width:2.5}#viewport{opacity:0;transition:opacity .35s ease}#viewport.ready{opacity:1}#loading{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#171a20;color:#9aa3b0;font-size:14px;letter-spacing:.03em;transition:opacity .5s ease}#loading.hide{opacity:0;pointer-events:none}.spinner{width:58px;height:58px;overflow:visible}.spinner .ring{fill:none;stroke-linecap:round;transform-box:fill-box;transform-origin:center}.spinner .ring-a{stroke:#8ab4ff;stroke-width:2.25;stroke-dasharray:96 66;opacity:.92;animation:spin-cw 2.6s linear infinite}.spinner .ring-b{stroke:#6f8fd6;stroke-width:2.25;stroke-dasharray:64 48;opacity:.72;animation:spin-ccw 3.4s linear infinite}.spinner .ring-c{stroke:#4d6fa3;stroke-width:2.25;stroke-dasharray:34 30;opacity:.6;animation:spin-cw 1.85s linear infinite}@keyframes spin-cw{to{transform:rotate(360deg)}}@keyframes spin-ccw{to{transform:rotate(-360deg)}}.loading-text{min-height:1.2em;transition:opacity .16s ease}.loading-text.swap{opacity:0}
</style>
<div id="loading">
<svg class="spinner" viewBox="0 0 64 64" aria-hidden="true">
<circle class="ring ring-a" cx="32" cy="32" r="27"/>
<circle class="ring ring-b" cx="32" cy="32" r="20"/>
<circle class="ring ring-c" cx="32" cy="32" r="13"/>
</svg>
<div class="loading-text" id="loading-text">Loading assets..</div>
</div>
<script>(function(){
var messages=["Loading assets..","Reticulating splines..","Imagining dragons..","Humming along..","Totally nerding out..","Warding off critics..","Consulting with Bowie.."];
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var queue=shuffle(messages),qi=0,el=document.getElementById("loading-text");
function refill(){var next=shuffle(messages);if(queue.length&&next[0]===queue[queue.length-1])next.push(next.shift());queue=next;qi=0}
function step(){if(qi>=queue.length)refill();el.classList.add("swap");setTimeout(function(){el.textContent=queue[qi++];el.classList.remove("swap")},160);setTimeout(step,1500+Math.random()*500)}
el.textContent=queue[qi++];setTimeout(step,1500+Math.random()*500);
})();</script>
<div id="viewport"><main id="timeline" aria-label="Music genres by decade"></main></div>
